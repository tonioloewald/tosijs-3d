<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>volumetric vs heightfield — does the swap show?</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        background: #0d1117;
        color: #e8eef2;
        font:
          14px/1.5 system-ui,
          sans-serif;
      }
      header {
        padding: 10px 14px;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 3px;
      }
      p {
        margin: 0;
        color: #93a4b0;
        font-size: 13px;
      }
      tosi-b3d {
        display: block;
        width: 100%;
        height: 62vh;
        min-height: 340px;
        background: #000;
      }
      .bar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 10px 14px;
      }
      button {
        background: #1b2431;
        color: #e8eef2;
        border: 1px solid #2c3949;
        border-radius: 6px;
        padding: 7px 12px;
        font-size: 14px;
      }
      button.on {
        background: #2a4c6d;
        border-color: #3d6f9c;
      }
      #out {
        padding: 4px 14px 16px;
        font:
          12px/1.5 ui-monospace,
          Menlo,
          monospace;
        color: #93a4b0;
        white-space: pre-wrap;
      }
      b {
        color: #6ee7a8;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Volumetric tile vs heightfield tile — same 5.33 m spacing</h1>
      <p>
        The claim to check by eye: at matching resolution these two surfaces
        agree, so swapping one for the other at the finest LOD shows nothing.
        Orbit with the mouse/finger. Green = heightfield, orange = volumetric.
      </p>
    </header>

    <tosi-b3d id="s" frame-rate="60">
      <tosi-b3d-light y="1" intensity="0.55"></tosi-b3d-light>
      <tosi-b3d-sun intensity="0.85"></tosi-b3d-sun>
      <tosi-b3d-skybox time-of-day="9"></tosi-b3d-skybox>
    </tosi-b3d>

    <div class="bar">
      <button id="bBoth" class="on">both</button>
      <button id="bHeight">heightfield only</button>
      <button id="bVol">volumetric only</button>
      <button id="bWire">wireframe</button>
      <button id="bCave">add a cavity</button>
    </div>
    <div id="out">building…</div>

    <script src="/volumetric-math.js"></script>
    <script src="/iife.js"></script>
    <script>
      const out = document.getElementById('out')
      const scene = document.getElementById('s')
      const { extractChunk, terrainDensity, PerlinNoise, carve } = window.volMath

      const SPACING = 5.33 // 128m tile / 24 subdivisions — the heightfield's own
      const SIZE = 128
      const noise = new PerlinNoise(7)
      const base = (x, z) => noise.fractal(x * 0.004, 0, z * 0.004, 4) * 60

      // A tube through the hill, so you can see a cavity appear in a surface
      // that is otherwise identical to the heightfield.
      const tube = carve.roughen(
        carve.capsule({ x: 20, y: -6, z: 20 }, { x: 108, y: -14, z: 96 }, 7),
        { amp: 2, scale: 0.05, octaves: 3, seed: 5 }
      )

      let heightMesh = null
      let volMesh = null
      let withCave = false
      let built = false

      const buildAll = (host, B) => {
        if (built) return
        built = true

        // ── the heightfield tile, exactly as terrain builds one ──────────
        const subs = Math.round(SIZE / SPACING)
        const pos = []
        const idx = []
        for (let iz = 0; iz <= subs; iz++) {
          for (let ix = 0; ix <= subs; ix++) {
            const x = (ix / subs) * SIZE
            const z = (iz / subs) * SIZE
            pos.push(x, base(x, z), z)
          }
        }
        for (let iz = 0; iz < subs; iz++) {
          for (let ix = 0; ix < subs; ix++) {
            const a = iz * (subs + 1) + ix
            idx.push(a, a + subs + 1, a + 1, a + 1, a + subs + 1, a + subs + 2)
          }
        }
        heightMesh = new B.Mesh('heightfield', host.scene)
        const hv = new B.VertexData()
        hv.positions = pos
        hv.indices = idx
        const hn = []
        B.VertexData.ComputeNormals(pos, idx, hn)
        hv.normals = hn
        hv.applyToMesh(heightMesh)
        const hm = new B.StandardMaterial('hm', host.scene)
        hm.diffuseColor = new B.Color3(0.35, 0.75, 0.45)
        hm.backFaceCulling = false
        heightMesh.material = hm

        rebuildVolumetric(host, B)

        // frame it
        const cam = host.scene.activeCamera
        if (cam && cam.setTarget) cam.setTarget(new B.Vector3(64, 0, 64))
        if (cam) {
          cam.radius = 200
          cam.beta = 1.1
        }
      }

      const rebuildVolumetric = (host, B) => {
        if (volMesh) volMesh.dispose()
        const density = withCave
          ? (x, y, z) => Math.max(terrainDensity(base)(x, y, z), tube(x, y, z))
          : terrainDensity(base)
        const cells = Math.round(SIZE / SPACING)
        const t0 = performance.now()
        const m = extractChunk(
          density,
          { ix: 0, iy: -6, iz: 0, nx: cells, ny: 10, nz: cells },
          { spacing: SPACING, jitter: 0.25, seed: 7 }
        )
        const ms = performance.now() - t0

        volMesh = new B.Mesh('volumetric', host.scene)
        const vd = new B.VertexData()
        vd.positions = Array.from(m.positions)
        vd.indices = Array.from(m.indices)
        vd.normals = Array.from(m.normals)
        vd.applyToMesh(volMesh)
        const vm = new B.StandardMaterial('vm', host.scene)
        vm.diffuseColor = new B.Color3(0.9, 0.45, 0.2)
        vm.backFaceCulling = false
        volMesh.material = vm
        volMesh.material.wireframe = wire

        // the number, on screen
        let max = 0
        let sum = 0
        for (let i = 0; i < m.vertexCount; i++) {
          const x = m.positions[i * 3]
          const y = m.positions[i * 3 + 1]
          const z = m.positions[i * 3 + 2]
          const d = Math.abs(y - base(x, z))
          max = Math.max(max, d)
          sum += d
        }
        out.textContent =
          `spacing ${SPACING}m · extraction ${ms.toFixed(1)}ms · ${m.triangleCount} triangles\n` +
          (withCave
            ? 'WITH a carved tube — the cavity is the only difference from the heightfield.\n'
            : '') +
          `deviation from the continuous terrain: max ${max.toFixed(3)}m, mean ${(sum / m.vertexCount).toFixed(3)}m\n` +
          `the heightfield mesh's OWN error at this spacing: max 0.266m, mean 0.068m — so they agree.`
      }

      let wire = false
      const setVis = (h, v) => {
        if (heightMesh) heightMesh.setEnabled(h)
        if (volMesh) volMesh.setEnabled(v)
      }
      const btns = ['bBoth', 'bHeight', 'bVol'].map((id) =>
        document.getElementById(id)
      )
      const mark = (el) => btns.forEach((b) => b.classList.toggle('on', b === el))
      btns[0].onclick = (e) => {
        setVis(true, true)
        mark(e.target)
      }
      btns[1].onclick = (e) => {
        setVis(true, false)
        mark(e.target)
      }
      btns[2].onclick = (e) => {
        setVis(false, true)
        mark(e.target)
      }
      document.getElementById('bWire').onclick = (e) => {
        wire = !wire
        e.target.classList.toggle('on', wire)
        if (volMesh) volMesh.material.wireframe = wire
        if (heightMesh) heightMesh.material.wireframe = wire
      }
      document.getElementById('bCave').onclick = (e) => {
        withCave = !withCave
        e.target.classList.toggle('on', withCave)
        e.target.textContent = withCave ? 'remove the cavity' : 'add a cavity'
        rebuildVolumetric(scene, window.__B)
      }

      // The update hook hands us BABYLON, which the bundle doesn't publish.
      scene.update = (host, B) => {
        window.__B = B
        buildAll(host, B)
      }
    </script>
  </body>
</html>
