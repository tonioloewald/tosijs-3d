<?xml version="1.0" encoding="utf-8"?>
<!--
  Aircraft HUD (normalized for live driving — see src/hud.ts).
  - 4 meter arcs (width 16), pathLength=1000 so a dash of level*1000 fills exactly:
      speed=left/red, altitude=right/blue  (vertical: fill bottom→top)
      health=top/green, energy=bottom/yellow (horizontal: fill MIDDLE-OUT)
  - frames: turquoise (#00a79e), matching the horizon.
  - #horizon: pitch ladder (translate/rotate live) + #hud-angle text (AoA number).
  - <defs> radar-trace glyph templates (centred at 0,0) + waypoint; the driver
    clones them into #traces. Everything is stroke-only on transparent bg, so it
    renders cleanly additive + translucent.
-->
<svg width="256px" height="256px" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <g id="meters" fill="none" stroke-linecap="butt" stroke-width="16">
    <path id="meter-speed" data-meter="speed" data-axis="v" pathLength="1000" stroke="#ff1d25" stroke-dasharray="0 1000"
      d="M60.1178,195.882 C22.6274,158.392,22.6274,97.6081,60.1178,60.1177"/>
    <path id="meter-altitude" data-meter="altitude" data-axis="v" pathLength="1000" stroke="#3ea9f5" stroke-dasharray="0 1000"
      d="M195.882,195.882 C233.373,158.392,233.373,97.6081,195.882,60.1178"/>
    <path id="meter-health" data-meter="health" data-axis="h" pathLength="1000" stroke="#8cc63f" stroke-dasharray="0 1000"
      d="M60.1178,60.1178 C97.6081,22.6274,158.392,22.6274,195.882,60.1178"/>
    <path id="meter-energy" data-meter="energy" data-axis="h" pathLength="1000" stroke="#fcee22" stroke-dasharray="0 1000"
      d="M60.1178,195.882 C97.6081,233.373,158.392,233.373,195.882,195.882"/>
  </g>

  <g id="frames" fill="none" stroke="#00a79e" stroke-width="4" stroke-miterlimit="10">
    <path d="M201.539,201.539 C242.154,160.925,242.154,95.0754,201.539,54.4609 C201.539,54.4609,190.225,65.7746,190.225,65.7746 C224.592,100.141,224.592,155.859,190.225,190.225 C190.225,190.225,201.539,201.539,201.539,201.539 z"/>
    <path d="M65.7746,190.225 C31.4085,155.859,31.4085,100.141,65.7746,65.7746 C65.7746,65.7746,54.4609,54.4609,54.4609,54.4609 C13.8464,95.0754,13.8464,160.925,54.4609,201.539 C54.4609,201.539,65.7746,190.225,65.7746,190.225 z"/>
    <path d="M65.7746,65.7746 C100.141,31.4085,155.859,31.4085,190.225,65.7746 C190.225,65.7746,201.539,54.4609,201.539,54.4609 C160.925,13.8464,95.0754,13.8464,54.4609,54.4609 C54.4609,54.4609,65.7746,65.7746,65.7746,65.7746 z"/>
    <path d="M54.4609,201.539 C95.0754,242.154,160.925,242.154,201.539,201.539 C201.539,201.539,190.225,190.225,190.225,190.225 C155.859,224.592,100.141,224.592,65.7746,190.225 C65.7746,190.225,54.4609,201.539,54.4609,201.539 z"/>
  </g>

  <g id="horizon" fill="none" stroke="#00a79e" stroke-width="2" stroke-opacity="0.5" stroke-linecap="butt">
    <g id="horizon-ladder">
      <path d="M64,128 L112,128"/>
      <path d="M144,128 L192,128"/>
      <path d="M96,96 L160,96"/>
      <path d="M96,112 L160,112"/>
      <path d="M96,144 L160,144"/>
      <path d="M96,160 L160,160"/>
    </g>
    <text id="hud-angle" x="128" y="128" fill="#00a79e" fill-opacity="0.9" stroke="none"
      font-family="ui-monospace, monospace" font-size="16" text-anchor="middle" dominant-baseline="central">40</text>
  </g>

  <!-- Live radar/waypoint traces are cloned into here by the driver. -->
  <g id="traces"></g>

  <defs>
    <g id="radar-neutral"><rect x="-8" y="-8" width="16" height="16" fill="none" stroke="#fcee22" stroke-width="4"/></g>
    <g id="radar-friendly"><circle r="8" fill="none" stroke="#8cc63f" stroke-width="4"/></g>
    <g id="radar-hostile"><path d="M0,-11.31 L11.31,0 L0,11.31 L-11.31,0 z" fill="none" stroke="#ff1d25" stroke-width="4"/></g>
    <g id="waypoint"><path d="M0,6.19 L-6.93,-6.19 L6.93,-6.19 z" fill="none" stroke="#00a79e" stroke-width="4"/></g>
  </defs>
</svg>
