<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>glb render test</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #223; }
    #c { width: 100vw; height: 100vh; display: block; touch-action: none; }
    #log { position: fixed; top: 0; left: 0; margin: 0; padding: 8px 12px;
      color: #4f8; font: 12px/1.5 ui-monospace, monospace; white-space: pre-wrap;
      background: rgba(0,0,0,.6); max-width: 60ch; z-index: 10; }
    #bar { position: fixed; bottom: 10px; left: 10px; z-index: 10; display: flex; gap: 6px; }
    #bar button { font: 12px monospace; padding: 4px 10px; cursor: pointer; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <pre id="log">loading Babylon…</pre>
  <div id="bar"></div>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
  <script>
    // Naive test: load the EXPORTED Kenney glb straight into Babylon (no b3d-biped,
    // no doc-system) to isolate whether the Blender-merged asset renders on its own.
    const logEl = document.getElementById('log')
    const log = (m) => { logEl.textContent += '\n' + m; console.log(m) }
    const canvas = document.getElementById('c')
    const engine = new BABYLON.Engine(canvas, true)
    const scene = new BABYLON.Scene(engine)
    scene.clearColor = new BABYLON.Color4(0.13, 0.16, 0.22, 1)
    const cam = new BABYLON.ArcRotateCamera('cam', -Math.PI / 2, Math.PI / 2.4, 9,
      new BABYLON.Vector3(0, 1.8, 0), scene)
    cam.wheelPrecision = 20
    cam.attachControl(canvas, true)
    new BABYLON.HemisphericLight('h', new BABYLON.Vector3(0.3, 1, 0.2), scene)
    // reference grid so we can judge scale/position
    const g = BABYLON.MeshBuilder.CreateGround('g', { width: 10, height: 10, subdivisions: 10 }, scene)
    g.material = new BABYLON.StandardMaterial('gm', scene)
    g.material.wireframe = true

    const rootUrl = 'https://cdn.tosijs.net/kenney/3D assets/Animated Characters Protagonists/'
    const file = 'characterMedium.glb'
    log('loading: ' + rootUrl + file)

    BABYLON.SceneLoader.ImportMeshAsync('', rootUrl, file, scene).then((r) => {
      log('✅ loaded — meshes: ' + r.meshes.map(m => m.name).filter(Boolean).join(', '))
      log('skeletons: ' + r.skeletons.length + '  animationGroups: ' + r.animationGroups.map(a => a.name).join(', '))
      const skinned = r.meshes.filter(m => m.getTotalVertices && m.getTotalVertices() > 0)
      log('mesh vertex counts: ' + skinned.map(m => m.name + '=' + m.getTotalVertices()).join(', '))
      const root = r.meshes.find(m => !m.parent) || r.meshes[0]
      const bb = root.getHierarchyBoundingVectors()
      const size = bb.max.subtract(bb.min)
      log('bbox size (WxHxD): ' + [size.x, size.y, size.z].map(n => n.toFixed(2)).join(' x '))
      log('bbox y: ' + bb.min.y.toFixed(2) + ' → ' + bb.max.y.toFixed(2))
      const mat = skinned[0] && skinned[0].material
      log('material: ' + (mat ? mat.name + ' (albedoTex=' + !!mat.albedoTexture + ')' : 'none'))

      // animation buttons — stop all, then play the chosen one, watching for collapse
      const bar = document.getElementById('bar')
      const stopAll = () => r.animationGroups.forEach(a => a.stop())
      const play = (name) => {
        stopAll()
        if (name) { const a = r.animationGroups.find(x => x.name.endsWith(name)); if (a) a.start(true) }
        // report the animated bbox a moment later
        setTimeout(() => {
          const b = root.getHierarchyBoundingVectors()
          const s = b.max.subtract(b.min)
          log('▶ ' + (name || 'bind pose') + ' → bbox ' + [s.x, s.y, s.z].map(n => n.toFixed(2)).join(' x '))
        }, 300)
      }
      ;['idle', 'run', 'jump', ''].forEach(n => {
        const btn = document.createElement('button')
        btn.textContent = n || 'bind pose'
        btn.onclick = () => play(n)
        bar.appendChild(btn)
      })
      play('idle')
    }).catch((e) => {
      log('❌ LOAD ERROR: ' + (e && e.message ? e.message : e))
    })

    engine.runRenderLoop(() => scene.render())
    addEventListener('resize', () => engine.resize())
  </script>
</body>
</html>
